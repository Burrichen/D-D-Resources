[project]
name = "dndres"
version = "0.1.0"
description = "Ingest, deduplicate and index D&D resources from Obsidian, MediaWiki/Miraheze, web pages and Google Docs."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27",
    "mwparserfromhell>=0.6",
    "trafilatura>=1.12",
    "rapidfuzz>=3.9",
    "jsonschema>=4.23",
    "numpy>=2.4.6",
]

[project.scripts]
dndres = "dndres.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dndres"]
